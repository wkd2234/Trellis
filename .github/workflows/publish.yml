name: Release CLI Tarballs

# Automatically builds and attaches `trellis-cli.tgz` + `trellis-core.tgz` to
# GitHub Releases whenever a `v*` tag is pushed (or via manual dispatch).
# Other machines can then install/upgrade with zero npm token:
#   npm install -g https://github.com/wkd2234/Trellis/releases/latest/download/trellis-cli.tgz
#   trellis upgrade
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.6.17-agy.1)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (core + cli)
        run: pnpm typecheck

      - name: Build (core + cli)
        run: pnpm build

      - name: Test (core + cli)
        run: pnpm test

      - name: Resolve release tag
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Pack release tarballs
        run: |
          node packages/cli/scripts/pack-release.js \
            --tag "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --out release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/trellis-cli.tgz release-assets/trellis-core.tgz --clobber
          else
            gh release create "$TAG" release-assets/trellis-cli.tgz release-assets/trellis-core.tgz \
              --title "$TAG" \
              --generate-notes
          fi
